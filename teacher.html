<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마음 극장 · 선생님</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1" crossorigin="anonymous"></script>
<style>
/* 선생님 화면: 학생 명단·접속 코드·QR, 학생 기록, 「이후의 이야기」 채점, 설정. 그림책 화면과 같은 크림색 종이 */
:root { --paper: #f3ead9; --card: #fffdf8; --line: #e5d8c3; --ink: #3b302b; --ink-2: #7d6f64; --green: #3f9c7d; --mint: #d3f0e1; --pink: #fde0d8; --alert: #c0503c; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 'Jua', 'Apple SD Gothic Neo', sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--card); border-bottom: 1.5px solid var(--line); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
header h1 { margin: 0; font-weight: 400; font-size: 22px; color: #2f6b55; }
nav { display: flex; gap: 6px; flex-wrap: wrap; }
nav button, .btn, .sub { font: inherit; min-height: 44px; padding: 6px 16px; border-radius: 999px; border: 1.5px solid var(--ink); background: #fff; cursor: pointer; color: var(--ink); }
nav button[aria-pressed="true"], .btn { background: var(--green); border-color: var(--green); color: #fff; }
.sub { min-height: 36px; padding: 4px 12px; font-size: 14px; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.card { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; }
h2 { margin: 0 0 8px; font-weight: 400; font-size: 20px; }
.soft { color: var(--ink-2); font-size: 14px; }
.err { color: var(--alert); }
textarea, input, select { font: inherit; width: 100%; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
input[type=radio], input[type=checkbox] { width: auto; padding: 0; margin: 0 6px 0 0; accent-color: var(--green); vertical-align: middle; }
.rub label { display: flex; align-items: flex-start; gap: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink-2); font-weight: 400; font-size: 13px; }
tr.pick { cursor: pointer; } tr.pick:hover { background: #fff8e1; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.qr { text-align: center; padding: 10px; }
.qr img { width: 130px; height: 130px; image-rendering: pixelated; }
.code { font-family: ui-monospace, Menlo, monospace; font-size: 20px; letter-spacing: .15em; }
.tag { display: inline-block; padding: 0 8px; border-radius: 999px; background: var(--mint); font-size: 13px; }
.tag.no { background: #eee6d8; color: var(--ink-2); }
.answer { padding: 8px 0; border-bottom: 1px dashed var(--line); }
.answer small { color: var(--ink-2); }
.story { white-space: pre-wrap; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; font-size: 17px; line-height: 1.7; }
.rub { display: grid; gap: 10px; }
.rub fieldset { border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 12px; margin: 0; }
.rub label { display: block; padding: 4px 0; font-size: 14px; cursor: pointer; }
.prov { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 6px; }
.prov.on { border-color: var(--green); background: #f1faf5; }
@media print { header, nav, .no-print { display: none !important; } body { background: #fff; } .card { border: 0; } .qr { break-inside: avoid; border: 1px solid #ccc; } }
</style>
</head>
<body>
<header class="no-print">
  <h1>마음 극장 · 선생님</h1>
  <nav id="tabs" hidden></nav>
  <span class="grow"></span>
  <a href="./" class="soft">학생 화면으로</a>
  <button id="out" class="sub" hidden>나가기</button>
</header>
<main id="main"></main>
<script>
'use strict';
// 학생 이름·글은 모두 textContent 로만 넣는다(innerHTML 쓰지 않음)
const $ = s => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === 'on') Object.entries(v).forEach(([ev, fn]) => e.addEventListener(ev, fn)); else if (v != null && v !== false) e.setAttribute(k, v === true ? '' : v); }
  kids.flat().forEach(k => k != null && e.append(k instanceof Node ? k : String(k)));

};
async function api(action, data = {}) {
  const r = await fetch('api/teacher', { method: 'POST', headers: { 'content-type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ action, ...data }) });
  const j = await r.json().catch(() => ({ error: '서버에 닿지 않아요. 버셀 주소에서 열어 주세요.' }));
  if (r.status === 401 && action !== 'login') { showLogin(j.error); throw new Error(j.error); }
  if (!r.ok) throw new Error(j.error || '문제가 생겼어요.');
  return j;
}
const BOOKS = [['book1', '1권 너 때문에'], ['book2', '2권 지우'], ['book3', '3권 민준'], ['book4', '4권 서아']];
const KIND = { choice: '갈림길', whatif: '만약에', feel: '감정 카드', compose: '하고 싶은 말', signals: '몸 신호', sort: '마음·행동 바구니', role: '작전판 역할', ending: '결말' };
const when = t => (t ? new Date(t).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-');
// 실명 보기: 이 컴퓨터 브라우저에만 저장하고 서버로 보내지 않는다
const real = () => { try { return JSON.parse(localStorage.getItem('maum-real') || '{}'); } catch { return {}; } };
const nameOf = s => real()[s.no] || s.alias;
let data = null, tab = 'roster';

function showLogin(msg) {
  $('#tabs').hidden = true; $('#out').hidden = true;
  const pw = h('input', { type: 'password', inputmode: 'numeric', autocomplete: 'current-password', placeholder: '비밀번호 (처음은 1324)' });
  const err = h('p', { class: 'err' }, msg && msg !== '선생님 비밀번호를 입력해 주세요.' ? msg : '');
  const go = async () => { try { await api('login', { password: pw.value }); await load(); } catch (e) { err.textContent = e.message; } };
  pw.addEventListener('keydown', e => e.key === 'Enter' && go());
  $('#main').replaceChildren(h('section', { class: 'card', style: 'max-width:420px;margin:40px auto' }, h('h2', {}, '선생님 비밀번호'), pw, h('div', { class: 'row', style: 'margin-top:10px' }, h('button', { class: 'btn', on: { click: go } }, '들어가기')), err,
    h('p', { class: 'soft' }, '학생 기록은 이 학급 서버(MongoDB)에만 저장돼요. 비밀번호는 암호화해서 저장해요.')));
  pw.focus();
}
async function load() {
  data = await api('overview');
  $('#out').hidden = false;
  const tabs = $('#tabs');
  tabs.hidden = false;
  // 처음 비밀번호(1324)로 들어온 동안에는 비밀번호 바꾸기만 (공개된 처음 값으로 학급 기록을 열지 못하게)
  if (!data.pinSet) tab = 'settings';
  const list = data.pinSet ? [['roster', '명단·QR'], ['records', '학생 기록'], ['stories', '이후의 이야기'], ['settings', '설정']] : [['settings', '비밀번호 바꾸기']];
  tabs.replaceChildren(...list.map(([k, t]) => h('button', { 'aria-pressed': String(tab === k), on: { click: () => { tab = k; load(); } } }, t)));
  ({ roster, records, stories, settings })[tab]();
  if (!data.pinSet) $('#main').prepend(h('section', { class: 'card', style: 'border-color:#c0503c' }, h('b', { class: 'err' }, '처음 비밀번호(1324)는 누구나 알 수 있어요. 먼저 숫자 4~12자리 새 비밀번호로 바꿔야 명단과 기록을 열 수 있어요.')));
}

// ---- 명단·코드·QR ----
function roster() {
  const ta = h('textarea', { rows: 8, placeholder: '1 햇살\n2 구름\n3 단풍' }, data.students.map(s => `${s.no} ${s.alias}`).join('\n'));
  const msg = h('span', { class: 'soft' });
  const realTa = h('textarea', { rows: 4, placeholder: '1 김하늘\n2 이도윤' }, Object.entries(real()).map(([n, v]) => `${n} ${v}`).join('\n'));
  const origin = location.origin + location.pathname.replace(/teacher\.html$/, '');
  const qrImg = code => { const q = qrcode(0, 'M'); q.addData(`${origin}?c=${code}`); q.make(); return h('img', { src: q.createDataURL(4, 2), alt: `${code} QR` }); };
  $('#main').replaceChildren(
    h('section', { class: 'card no-print' }, h('h2', {}, '반 명단'), h('p', { class: 'soft' }, '한 줄에 한 명, 「번호 가명」으로 적어요. 실명 대신 가명이나 별명을 권해요. 서버에는 번호와 가명만 저장해요.'), ta,
      h('div', { class: 'row', style: 'margin-top:8px' }, msg, h('span', { class: 'grow' }), h('button', { class: 'btn', on: { click: async () => {
        // 명단에서 빠지는 번호가 있으면 그 학생 기록도 지울지 묻는다 (지우지 않으면 기록은 남는다)
        const keep = new Set(ta.value.split('\n').map(l => (/^\s*(\d{1,3})/.exec(l) || [])[1]).filter(Boolean).map(Number));
        const gone = data.students.filter(s => !keep.has(s.no));
        const dropRemoved = gone.length > 0 && confirm(`명단에서 빠지는 ${gone.map(s => s.no + '번').join(', ')}의 기록(진행, 답, 글)도 지울까요?\n취소를 누르면 기록은 남아요.`);
        try { const r = await api('roster', { text: ta.value, dropRemoved }); msg.textContent = `${r.students.length}명을 저장했어요. 같은 번호는 원래 코드를 그대로 써요.`; load(); } catch (e) { msg.textContent = e.message; }
      } } }, '명단 저장'))),
    h('section', { class: 'card no-print' }, h('h2', {}, '실명 보기 (이 컴퓨터에만)'), h('p', { class: 'soft' }, '「번호 이름」을 넣으면 이 브라우저에만 저장돼요. 서버와 AI 로는 보내지 않아요.'), realTa,
      h('div', { class: 'row', style: 'margin-top:8px' }, h('button', { class: 'sub', on: { click: () => { const m = {}; realTa.value.split('\n').forEach(l => { const x = /^\s*(\d+)\s+(.+)$/.exec(l); if (x) m[x[1]] = x[2].trim(); }); localStorage.setItem('maum-real', JSON.stringify(m)); load(); } } }, '이 컴퓨터에 저장'), h('button', { class: 'sub', on: { click: () => { if (confirm('이 컴퓨터의 실명을 지울까요?')) { localStorage.removeItem('maum-real'); load(); } } } }, '지우기'))),
    data.students.length ? h('section', { class: 'card' }, h('div', { class: 'row no-print' }, h('h2', { class: 'grow' }, '접속 코드·QR 카드'), h('button', { class: 'sub', on: { click: () => print() } }, 'QR 카드 인쇄')),
      h('p', { class: 'soft no-print' }, `학생은 이 주소에서 코드를 넣거나 QR 을 찍어 들어와요: ${origin}`),
      h('div', { class: 'cards' }, data.students.map(s => h('div', { class: 'card qr' }, h('div', {}, `${s.no}번 ${nameOf(s)}`), qrImg(s.code), h('div', { class: 'code' }, s.code),
        h('button', { class: 'sub no-print', on: { click: async () => { if (confirm(`${s.no}번 코드를 새로 만들까요? 예전 코드와 QR 은 더 쓸 수 없어요.`)) { await api('newCode', { no: s.no }); load(); } } } }, '새 코드'))))) : '',
  );
}

// ---- 학생 기록 ----
function records() {
  const tb = h('tbody');
  data.students.forEach(s => tb.append(h('tr', { class: 'pick', on: { click: () => detail(s) } }, h('td', {}, `${s.no} ${nameOf(s)}`),
    BOOKS.map(([id]) => h('td', {}, s.books[id] ? h('span', { class: 'tag' }, `결말 ${s.books[id]}`) : h('span', { class: 'tag no' }, '아직'))),
    h('td', {}, String(s.answers)), h('td', {}, s.story ? `${s.story.chars}자` : '-'), h('td', {}, when(s.at)))));
  $('#main').replaceChildren(h('section', { class: 'card' }, h('h2', {}, '학생 기록'), h('p', { class: 'soft' }, '학생을 누르면 고른 답이 시간순으로 나와요.'),
    h('div', { style: 'overflow-x:auto' }, h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, '학생'), BOOKS.map(([, t]) => h('th', {}, t)), h('th', {}, '답'), h('th', {}, '이후의 이야기'), h('th', {}, '마지막 저장'))), tb))), h('div', { id: 'detail' }));
}
async function detail(s) {
  const d = await api('student', { no: s.no });
  const box = $('#detail');
  box.replaceChildren(h('section', { class: 'card' }, h('div', { class: 'row' }, h('h2', { class: 'grow' }, `${s.no} ${nameOf(s)}의 답`), h('button', { class: 'sub', on: { click: async () => { if (confirm(`${s.no}번의 기록(진행, 답, 글)을 모두 지울까요? 되돌릴 수 없어요.`)) { await api('clear', { no: s.no }); load(); } } } }, '이 학생 기록 지우기')),
    d.answers.length ? d.answers.map(a => h('div', { class: 'answer' }, h('small', {}, `${when(a.t)} · ${(BOOKS.find(b => b[0] === a.book) || [, a.book])[1]} · ${KIND[a.kind] || a.kind}`), h('div', {}, a.q ? `${a.q} → ` : '', h('b', {}, a.a)))) : h('p', { class: 'soft' }, '아직 쌓인 답이 없어요.'),
    d.story ? [h('h2', { style: 'margin-top:12px' }, '이후의 이야기'), h('div', { class: 'story' }, d.story.text)] : ''));
  box.scrollIntoView({ behavior: 'smooth' });
}

// ---- 이후의 이야기: 교사 채점 + AI 채점 ----
async function stories() {
  const { stories: list } = await api('stories');
  const rub = data.settings.rubric;
  const msg = h('span', { class: 'soft' });
  const sec = h('section', { class: 'card' }, h('div', { class: 'row' }, h('h2', { class: 'grow' }, `이후의 이야기 (${list.length}편)`), msg,
    h('button', { class: 'sub', on: { click: async () => { msg.textContent = 'AI 가 채점하는 중…'; try { let r; do { r = await api('aiGrade', { all: true }); msg.textContent = `AI 채점 ${r.done}편 끝${r.left ? `, ${r.left}편 남음` : ''}`; } while (r.left && r.done); stories(); } catch (e) { msg.textContent = e.message; } } } }, '아직 안 된 글 모두 AI 채점')),
    h('p', { class: 'soft' }, `채점 기준 ${rub.length}가지, 기준마다 1~3점. AI 에는 학생 글만 보내고 번호·이름은 보내지 않아요. 지금 AI: ${data.settings.providers[data.settings.provider].label}`));
  const main = $('#main');
  main.replaceChildren(sec);
  list.forEach(y => {
    const s = data.students.find(x => x.no === y.no) || { no: y.no, alias: '(명단에 없음)' };
    const pick = {};
    const form = h('div', { class: 'rub' }, rub.map(r => h('fieldset', {}, h('legend', {}, r.name), r.levels.map((lv, i) => {
      const inp = h('input', { type: 'radio', name: `${y.no}-${r.id}`, value: i + 1, checked: y.teacher && y.teacher.scores[r.id] === i + 1, on: { change: () => { pick[r.id] = i + 1; } } });
      if (y.teacher && y.teacher.scores[r.id] === i + 1) pick[r.id] = i + 1;
      return h('label', {}, inp, ` ${i + 1}점 · ${lv}`);
    }))));
    const comment = h('textarea', { rows: 2, placeholder: '학생에게 한마디' }, (y.teacher && y.teacher.comment) || '');
    const note = h('span', { class: 'soft' });
    const ai = y.ai ? h('div', { class: 'card', style: 'background:#f6fbff' }, h('b', {}, `AI 채점 (${y.ai.model}) · 합 ${Object.values(y.ai.scores).reduce((a, b) => a + b, 0)}점`), h('div', {}, rub.map(r => `${r.name} ${y.ai.scores[r.id] || '-'}`).join(' · ')), h('p', {}, y.ai.comment), y.ai.at < y.at ? h('p', { class: 'err' }, '학생이 글을 고친 뒤라 다시 채점하면 좋아요.') : '') : '';
    main.append(h('section', { class: 'card' }, h('div', { class: 'row' }, h('h2', { class: 'grow' }, `${s.no} ${nameOf(s)}`), h('span', { class: 'soft' }, `${[...y.text.replace(/\s/g, '')].length}자 · ${when(y.at)}${y.versions > 1 ? ` · ${y.versions}번째 고침` : ''}`)),
      h('div', { class: 'story' }, y.text), h('h2', { style: 'margin-top:12px' }, '선생님 채점'), form, comment,
      h('div', { class: 'row', style: 'margin-top:8px' }, note, h('span', { class: 'grow' }),
        h('button', { class: 'sub', on: { click: async () => { note.textContent = 'AI 채점 중…'; try { await api('aiGrade', { no: y.no }); stories(); } catch (e) { note.textContent = e.message; } } } }, 'AI 채점'),
        h('button', { class: 'btn', on: { click: async () => { try { await api('grade', { no: y.no, scores: pick, comment: comment.value }); note.textContent = '저장했어요.'; } catch (e) { note.textContent = e.message; } } } }, '선생님 채점 저장')), ai));
  });
}

// ---- 설정: 비밀번호, AI 키 4종, 채점 기준, 글자 수, 글감, 기록 지우기 ----
function settings() {
  const st = data.settings;
  const cur = h('input', { type: 'password', inputmode: 'numeric', placeholder: '지금 비밀번호' }), nx = h('input', { type: 'password', inputmode: 'numeric', placeholder: '새 비밀번호 (숫자 4~12자리)' });
  const pinMsg = h('span', { class: 'soft' });
  let provider = st.provider;
  const keys = {}, models = { ...st.models };
  const provBox = h('div', { class: 'rub' });
  const LINKS = { upstage: 'https://console.upstage.ai/api-keys', claude: 'https://console.anthropic.com/settings/keys', openai: 'https://platform.openai.com/api-keys', gemini: 'https://aistudio.google.com/apikey' };
  const drawProv = () => provBox.replaceChildren(...Object.entries(st.providers).map(([p, info]) => {
    const key = h('input', { type: 'password', autocomplete: 'off', placeholder: st.keys[p] ? '바꿀 때만 새로 넣어요' : `키 붙여 넣기 (${info.keyHint})`, on: { input: e => { keys[p] = e.target.value; } } });
    const model = h('input', { value: models[p], on: { input: e => { models[p] = e.target.value; } } });
    const out = h('span', { class: 'soft' });
    return h('div', { class: 'prov' + (provider === p ? ' on' : '') },
