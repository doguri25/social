# v 로 시작하는 태그를 올리면 CHANGELOG.md 의 그 버전 부분으로 GitHub 릴리즈를 만들고 index.html 을 붙인다.
#   git tag v0.9.0 && git push origin v0.9.0
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 바뀐 점 꺼내기
        id: notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## v$v " 'index($0, "## v") == 1 { on = index($0, h) == 1; next } on' CHANGELOG.md > notes.md
          title=$(grep -m1 "^## v$v " CHANGELOG.md | sed -e 's/^## //' -e 's/ ([0-9-]*)$//')
          echo "title=${title:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          cat notes.md
      - name: 릴리즈 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: gh release create "$GITHUB_REF_NAME" --title "$TITLE" --notes-file notes.md --verify-tag index.html
