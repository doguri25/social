# GitHub 릴리즈 만들기: CHANGELOG.md 의 그 버전 부분을 바뀐 점 글로 쓰고 index.html 을 붙인다.
#   - CHANGELOG.md 가 바뀐 채로 브랜치에 올라오면: 맨 위 버전(## vX.Y.Z)의 릴리즈가 아직 없을 때만 그 커밋에 태그를 달고 만든다
#   - v 로 시작하는 태그를 올리면: 그 태그의 버전으로 만든다 (git tag v0.9.0 && git push origin v0.9.0)
name: release
on:
  push:
    tags: ['v*']
    branches: ['**']
    paths: ['CHANGELOG.md']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 버전과 바뀐 점 꺼내기
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"
          else v=$(grep -m1 -o '^## v[0-9][0-9.]*' CHANGELOG.md | sed 's/^## v//'); fi
          [ -n "$v" ] || { echo "CHANGELOG.md 에 버전이 없음"; exit 1; }
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then echo "v$v 릴리즈가 이미 있음"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          awk -v h="## v$v " 'index($0, "## v") == 1 { on = index($0, h) == 1; next } on' CHANGELOG.md > notes.md
          title=$(grep -m1 "^## v$v " CHANGELOG.md | sed -e 's/^## //' -e 's/ ([0-9-]*)$//')
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "title=${title:-v$v}" >> "$GITHUB_OUTPUT"
          cat notes.md
      - name: 릴리즈 만들기
        if: steps.notes.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file notes.md --target "$GITHUB_SHA" index.html
